<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-free-swap dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #17202e;
      --muted: #667085;
      --line: #d9e1ea;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.07);
      --green: #137a46;
      --green-soft: #daf7e6;
      --amber: #9a6200;
      --amber-soft: #fff1c7;
      --red: #b42318;
      --red-soft: #ffe0dc;
      --blue: #235dd8;
      --blue-soft: #dfe9ff;
      --cyan: #087a8f;
      --cyan-soft: #d8f4f8;
      --gray-soft: #edf1f6;
      --danger-panel: #fff7f6;
      --warning-panel: #fffaf0;
      --success-panel: #f3fbf6;
      --info-panel: #f5f8ff;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10141b;
      --panel: #171d26;
      --panel-soft: #1e2631;
      --text: #eef3f8;
      --muted: #9ba8b7;
      --line: #2b3542;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      --green: #62d58d;
      --green-soft: #173523;
      --amber: #f7c45b;
      --amber-soft: #3b2b0f;
      --red: #ff8a80;
      --red-soft: #3e1c1d;
      --blue: #8db2ff;
      --blue-soft: #1c2b4f;
      --cyan: #64d7e6;
      --cyan-soft: #15343b;
      --gray-soft: #273140;
      --danger-panel: #21191b;
      --warning-panel: #211d15;
      --success-panel: #15211a;
      --info-panel: #151b28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .page { max-width: 1360px; margin: 0 auto; padding: 22px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 26px; line-height: 1.1; letter-spacing: 0; }
    .sub { color: var(--muted); margin-top: 6px; }
    .top-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .status-line { color: var(--muted); text-align: right; min-width: 220px; }
    .theme-switch {
      display: inline-flex;
      padding: 3px;
      gap: 3px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .theme-switch button {
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      min-height: 30px;
      padding: 5px 10px;
    }
    .theme-switch button.active {
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(16, 24, 40, 0.12);
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .kpi { padding: 14px; min-height: 88px; border-top: 3px solid var(--line); }
    .kpi.good { border-top-color: var(--green); }
    .kpi.warn { border-top-color: var(--amber); }
    .kpi.bad { border-top-color: var(--red); }
    .kpi.info { border-top-color: var(--blue); }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .kpi .value { font-size: 28px; font-weight: 750; margin-top: 8px; line-height: 1; }
    .kpi .hint { color: var(--muted); margin-top: 8px; font-size: 12px; }
    .ratio-counts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      margin-top: 8px;
      font-size: 12px;
    }
    .ratio-counts .passed { color: var(--green); font-weight: 700; }
    .ratio-counts .failed { color: var(--red); font-weight: 700; }
    .ratio-meter {
      display: flex;
      width: 100%;
      height: 8px;
      background: var(--gray-soft);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .ratio-meter span { display: block; min-width: 0; transition: width 160ms ease; }
    .ratio-meter .passed { background: var(--green); }
    .ratio-meter .failed { background: var(--red); }
    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .priority-groups { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 14px; }
    .priority-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel-soft);
    }
    .priority-group.group-strong { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
    .priority-group.group-warning { border-color: color-mix(in srgb, var(--amber) 45%, var(--line)); }
    .priority-group.group-poor,
    .priority-group.group-failing { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); }
    .priority-group.group-running { border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }
    .priority-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-left: 4px solid var(--blue);
      background: var(--panel);
    }
    .priority-group.group-strong .priority-head { border-left-color: var(--green); }
    .priority-group.group-warning .priority-head { border-left-color: var(--amber); }
    .priority-group.group-poor .priority-head,
    .priority-group.group-failing .priority-head { border-left-color: var(--red); }
    .priority-group.group-running .priority-head { border-left-color: var(--blue); }
    .priority-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .priority-title strong { font-size: 15px; }
    .priority-note { color: var(--muted); font-size: 12px; }
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 10px;
      padding: 10px;
    }
    .model-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .model-card.state-strong { border-left-color: var(--green); background: linear-gradient(90deg, var(--success-panel), var(--panel) 42%); }
    .model-card.state-warning { border-left-color: var(--amber); background: linear-gradient(90deg, var(--warning-panel), var(--panel) 42%); }
    .model-card.state-poor,
    .model-card.state-failing { border-left-color: var(--red); background: linear-gradient(90deg, var(--danger-panel), var(--panel) 42%); }
    .model-card.state-running { border-left-color: var(--blue); background: linear-gradient(90deg, var(--info-panel), var(--panel) 42%); }
    .model-card.state-limited { border-left-color: var(--amber); background: linear-gradient(90deg, var(--warning-panel), var(--panel) 42%); }
    .model-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .backend-name { font-weight: 700; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .model-name { color: var(--text); font-size: 13px; overflow-wrap: anywhere; margin-top: 7px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: var(--panel-soft);
      min-width: 0;
    }
    .stat span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .stat strong { display: block; margin-top: 5px; font-size: 15px; overflow-wrap: anywhere; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .priority-pill { color: var(--blue); background: var(--blue-soft); }
    .healthy { color: var(--green); background: var(--green-soft); }
    .running { color: var(--blue); background: var(--blue-soft); }
    .failing { color: var(--red); background: var(--red-soft); }
    .limited { color: var(--amber); background: var(--amber-soft); }
    .idle { color: var(--muted); background: var(--gray-soft); }
    .bar {
      width: 100%;
      height: 8px;
      background: var(--gray-soft);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar > span { display: block; height: 100%; background: var(--green); border-radius: 999px; }
    .bar.warning > span { background: var(--amber); }
    .bar.poor > span,
    .bar.failing > span { background: var(--red); }
    .bar.running > span { background: var(--blue); }
    .bar.limited > span { background: var(--amber); }
    .failbar > span { background: var(--red); }
    .tokenbar > span { background: var(--cyan); }
    .spark-row { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .spark-row.state-strong { box-shadow: inset 3px 0 0 var(--green); }
    .spark-row.state-warning { box-shadow: inset 3px 0 0 var(--amber); background: var(--warning-panel); }
    .spark-row.state-poor,
    .spark-row.state-failing { box-shadow: inset 3px 0 0 var(--red); background: var(--danger-panel); }
    .spark-row.state-running { box-shadow: inset 3px 0 0 var(--blue); background: var(--info-panel); }
    .spark-row.state-limited { box-shadow: inset 3px 0 0 var(--amber); background: var(--warning-panel); }
    .spark-row:last-child { border-bottom: 0; }
    .spark-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .spark-label { font-weight: 700; overflow-wrap: anywhere; }
    .spark-value { color: var(--muted); white-space: nowrap; }
    .stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .error-card {
      margin-top: 12px;
      border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line));
      border-radius: 8px;
      background: var(--danger-panel);
      color: var(--red);
      padding: 10px 12px;
    }
    .error-card span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .error-card strong { display: block; font-size: 14px; }
    .error-card p {
      margin: 5px 0 0;
      color: var(--text);
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty { padding: 18px; color: var(--muted); }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .main-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .page { padding: 12px; }
      header { align-items: flex-start; flex-direction: column; }
      .top-actions { justify-content: flex-start; }
      .status-line { text-align: left; min-width: 0; }
      .kpis { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .models-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>ai-free-swap</h1>
        <div class="sub" id="subtitle">Dashboard loading</div>
      </div>
      <div class="top-actions">
        <div class="theme-switch" aria-label="Theme">
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </div>
        <div class="status-line" id="statusLine">Waiting for data</div>
      </div>
    </header>

    <section class="kpis">
      <div class="panel kpi info"><div class="label">Active</div><div class="value" id="kActive">0</div><div class="hint">running provider calls</div></div>
      <div class="panel kpi info"><div class="label">Total Tokens</div><div class="value" id="kTokens">0</div><div class="hint" id="kTokensHint">0 prompt | 0 output</div></div>
      <div class="panel kpi good">
        <div class="label">Passed / Failed</div>
        <div class="value" id="kPassFail">0:0</div>
        <div class="ratio-counts"><span class="passed" id="kPassed">0 passed</span><span class="failed" id="kFailed">0 failed</span></div>
        <div class="ratio-meter" aria-label="Passed and failed requests"><span class="passed" id="kPassedBar"></span><span class="failed" id="kFailedBar"></span></div>
      </div>
      <div class="panel kpi good"><div class="label">Success</div><div class="value" id="kSuccess">-</div><div class="hint" id="kSuccessHint">0 attempts</div></div>
      <div class="panel kpi warn"><div class="label">Rate Limited</div><div class="value" id="kLimited">0</div><div class="hint">skipped attempts</div></div>
      <div class="panel kpi info"><div class="label">Backends</div><div class="value" id="kBackends">0</div><div class="hint">configured providers</div></div>
    </section>

    <main class="main-grid">
      <section class="panel">
        <div class="section-title">
          <span>Models by Priority</span>
          <span id="modelCount" class="meta"></span>
        </div>
        <div class="priority-groups" id="priorityGroups"></div>
      </section>

      <aside class="stack">
        <section class="panel">
          <div class="section-title">Reliability</div>
          <div id="successBars"></div>
        </section>
        <section class="panel">
          <div class="section-title">Token Share</div>
          <div id="tokenBars"></div>
        </section>
        <section class="panel">
          <div class="section-title">Rate Limit Windows</div>
          <div id="windowBars"></div>
        </section>
      </aside>
    </main>
  </div>

  <script>
    const THEME_KEY = "ai-free-swap-theme";
    const fmt = new Intl.NumberFormat();
    const pct = value => value === null || value === undefined ? "-" : `${value.toFixed(1)}%`;
    const num = value => fmt.format(Math.round(value || 0));
    const ms = value => value === null || value === undefined ? "-" : `${Math.round(value)} ms`;
    const when = seconds => seconds ? new Date(seconds * 1000).toLocaleTimeString() : "-";
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

    function gcd(a, b) {
      let x = Math.abs(Math.round(a || 0));
      let y = Math.abs(Math.round(b || 0));
      while (y) [x, y] = [y, x % y];
      return x || 1;
    }

    function passFailRatio(passed, failed) {
      if (!passed && !failed) return "0:0";
      const divisor = gcd(passed, failed);
      return `${num(passed / divisor)}:${num(failed / divisor)}`;
    }

    function statusClass(status) {
      return ["healthy", "running", "failing", "limited", "idle"].includes(status) ? status : "idle";
    }

    function setTheme(theme) {
      const selected = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = selected;
      localStorage.setItem(THEME_KEY, selected);
      document.querySelectorAll("[data-theme-choice]").forEach(button => {
        button.classList.toggle("active", button.dataset.themeChoice === selected);
      });
    }

    function healthState(item) {
      if (item.status === "limited") return "limited";
      if (item.status === "running") return "running";
      if (item.status === "failing") return "failing";
      if (item.success_rate === null || item.success_rate === undefined) return "idle";
      if (item.success_rate >= 95) return "strong";
      if (item.success_rate >= 75) return "warning";
      if (item.success_rate > 0) return "poor";
      return item.attempts ? "failing" : "idle";
    }

    function groupState(items, rate) {
      if (items.some(item => item.active > 0)) return "running";
      if (items.some(item => item.status === "limited")) return "limited";
      if (rate === null || rate === undefined) return "idle";
      if (rate >= 95) return "strong";
      if (rate >= 75) return "warning";
      if (rate > 0) return "poor";
      return "failing";
    }

    function bar(width, cls = "") {
      const safeWidth = Math.max(0, Math.min(100, width || 0));
      return `<div class="bar ${cls}"><span style="width:${safeWidth}%"></span></div>`;
    }

    function renderSpark(container, rows, valueFn, labelFn, cls = "", stateFn = null) {
      const max = Math.max(1, ...rows.map(valueFn));
      container.innerHTML = rows.map(item => {
        const value = valueFn(item);
        const state = stateFn ? stateFn(item) : "";
        return `<div class="spark-row ${state ? `state-${state}` : ""}">
          <div class="spark-head"><span class="spark-label">${esc(labelFn(item))}</span><span class="spark-value">${num(value)}</span></div>
          ${bar(value / max * 100, `${cls} ${state}`)}
        </div>`;
      }).join("") || `<div class="empty">No data yet</div>`;
    }

    function groupByPriority(backends) {
      const groups = new Map();
      for (const item of backends) {
        const key = item.priority ?? 999;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      return [...groups.entries()].sort((a, b) => a[0] - b[0]);
    }

    function summarizeError(rawError) {
      if (!rawError) return null;
      const text = String(rawError).replace(/\s+/g, " ").trim();
      const codeMatch = text.match(/\b(4\d\d|5\d\d)\b/);
      const code = codeMatch ? codeMatch[1] : "";
      const lower = text.toLowerCase();
      let title = code ? `Provider error ${code}` : "Provider error";
      if (code === "429" || lower.includes("quota") || lower.includes("rate limit")) {
        title = code === "429" ? "Quota or rate limit reached" : "Rate limit reached";
      } else if (code === "401" || code === "403" || lower.includes("api key") || lower.includes("auth")) {
        title = "Authentication failed";
      } else if (code && code.startsWith("5")) {
        title = "Provider unavailable";
      }

      const messageMatch = text.match(/['"]message['"]\s*:\s*['"]([^'"]+)/i)
        || text.match(/message="?([^"]+)/i);
      let detail = messageMatch ? messageMatch[1] : text;
      detail = detail
        .replace(/^error message=/i, "")
        .replace(/^Error code:\s*\d+\s*-\s*/i, "")
        .replace(/^[{[\s'"]+/, "")
        .trim();
      if (detail.length > 150) detail = `${detail.slice(0, 147)}...`;
      if (!detail || detail === text) {
        detail = code ? `The provider returned HTTP ${code}. Check this backend's quota, credentials, or provider status.` : "Check this backend's quota, credentials, or provider status.";
      }
      return { title, detail };
    }

    function renderModelCard(item) {
      const requestCount = item.successes + item.failures;
      const successWidth = item.success_rate === null ? 0 : item.success_rate;
      const state = healthState(item);
      const error = summarizeError(item.last_error);
      return `<article class="model-card state-${state}">
        <div class="model-top">
          <div>
            <div class="backend-name">${esc(item.label)}</div>
            <div class="meta">${esc(item.provider)}${item.name ? ` | ${esc(item.name)}` : ""}</div>
          </div>
          <span class="pill ${statusClass(item.status)}">${esc(item.status)}</span>
        </div>
        <div class="model-name">${esc(item.model)}</div>
        ${bar(successWidth, state)}
        <div class="stats">
          <div class="stat"><span>Success</span><strong>${pct(item.success_rate)}</strong></div>
          <div class="stat"><span>Requests</span><strong>${num(requestCount)}</strong></div>
          <div class="stat"><span>Latency</span><strong>${ms(item.avg_latency_ms)}</strong></div>
          <div class="stat"><span>Active</span><strong>${num(item.active)}</strong></div>
          <div class="stat"><span>Tokens</span><strong>${num(item.total_tokens)}</strong></div>
          <div class="stat"><span>Limited</span><strong>${num(item.rate_limited_skips)}</strong></div>
        </div>
        ${error ? `<div class="error-card" title="${esc(item.last_error)}"><span>Last error</span><strong>${esc(error.title)}</strong><p>${esc(error.detail)}</p></div>` : ""}
      </article>`;
    }

    function renderPriorityGroups(backends) {
      const groups = groupByPriority(backends);
      document.getElementById("priorityGroups").innerHTML = groups.map(([priority, items], index) => {
        const active = items.reduce((total, item) => total + item.active, 0);
        const attempts = items.reduce((total, item) => total + item.attempts, 0);
        const successes = items.reduce((total, item) => total + item.successes, 0);
        const rate = attempts ? successes / attempts * 100 : null;
        const state = groupState(items, rate);
        return `<section class="priority-group group-${state}">
          <div class="priority-head">
            <div class="priority-title">
              <span class="pill priority-pill">Priority ${priority}</span>
              <strong>${index === 0 ? "Primary route" : "Fallback route"}</strong>
              <span class="priority-note">${num(items.length)} backend${items.length === 1 ? "" : "s"}</span>
            </div>
            <div class="priority-note">${active ? `${num(active)} active | ` : ""}${pct(rate)} success</div>
          </div>
          <div class="models-grid">${items.map(renderModelCard).join("")}</div>
        </section>`;
      }).join("") || `<div class="empty">No backends configured</div>`;
    }

    function render(data) {
      const totals = data.totals;
      const backends = data.backends;
      const passed = totals.successes || 0;
      const failed = totals.failures || 0;
      const passFailTotal = passed + failed;
      const passedWidth = passFailTotal ? passed / passFailTotal * 100 : 0;
      const failedWidth = passFailTotal ? failed / passFailTotal * 100 : 0;
      document.getElementById("subtitle").textContent = `${data.model_name} | routing: ${data.model_routing} | cycles: ${data.keep_cycles}`;
      document.getElementById("statusLine").textContent = `Updated ${when(data.generated_at)} | started ${when(data.started_at)}`;
      document.getElementById("kActive").textContent = num(totals.active);
      document.getElementById("kTokens").textContent = num(totals.total_tokens);
      document.getElementById("kTokensHint").textContent = `${num(totals.prompt_tokens)} prompt | ${num(totals.completion_tokens)} output`;
      document.getElementById("kPassFail").textContent = passFailRatio(passed, failed);
      document.getElementById("kPassed").textContent = `${num(passed)} passed`;
      document.getElementById("kFailed").textContent = `${num(failed)} failed`;
      document.getElementById("kPassedBar").style.width = `${passedWidth}%`;
      document.getElementById("kFailedBar").style.width = `${failedWidth}%`;
      document.getElementById("kSuccess").textContent = pct(totals.success_rate);
      document.getElementById("kSuccessHint").textContent = `${num(totals.attempts)} attempts`;
      document.getElementById("kLimited").textContent = num(totals.rate_limited_skips);
      document.getElementById("kBackends").textContent = num(totals.backends);
      document.getElementById("modelCount").textContent = `${num(backends.length)} models`;
      renderPriorityGroups(backends);

      const activeFirst = [...backends].sort((a, b) => (b.success_rate || 0) - (a.success_rate || 0));
      renderSpark(document.getElementById("successBars"), activeFirst, item => item.success_rate || 0, item => item.label, "", healthState);
      renderSpark(document.getElementById("tokenBars"), backends, item => item.total_tokens, item => item.label, "tokenbar");
      renderSpark(document.getElementById("windowBars"), backends, item => {
        const counters = item.rate_counters.requests || {};
        return Math.max(0, ...Object.values(counters));
      }, item => item.label, "failbar");
    }

    async function refresh() {
      try {
        const response = await fetch("/dashboard/data", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        document.getElementById("statusLine").textContent = `Dashboard error: ${error.message}`;
      }
    }

    document.querySelectorAll("[data-theme-choice]").forEach(button => {
      button.addEventListener("click", () => setTheme(button.dataset.themeChoice));
    });
    setTheme(localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
